<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b5cab" />
  <meta name="description" content="Saathi - a simple voice-first daily assistant for elderly users." />
  <title>Saathi — Your Daily Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Kannada:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Go to Saathi home">
        <span class="brand-mark">S</span>
        <span>
          <strong>Saathi</strong>
          <small id="brandSubtitle">Your daily companion</small>
        </span>
      </button>

      <div class="top-actions">
        <span class="language-pill" id="languagePill">English</span>
        <button class="icon-button" id="stopSpeechButton" aria-label="Stop speaking" title="Stop speaking">■</button>
      </div>
    </header>

    <main id="app" class="main-content" aria-live="polite"></main>

    <footer class="footer">
      <span>Saathi</span>
      <span>•</span>
      <span id="demoFooter">Simple. Safe. With you.</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="assertive"></div>
  <script src="js/app.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/messageExplainer.js"></script>
  <script src="js/upiflow.js"></script>
  <script src="js/emergency.js"></script>
</body>
</html>
